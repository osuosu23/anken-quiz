<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サムネイル案件クイズ</title>
  <meta name="description" content="サムネとタイトルだけで企業案件を見抜こう！">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- ゲーム背景エフェクトレイヤー（巨大 ◯・✕・案件・案件じゃない） -->
  <div id="game-bg-effects" class="game-bg-effects" aria-hidden="true">
    <div id="bg-symbol-wrap" class="bg-symbol-wrap"></div>
    <div id="bg-text-wrap" class="bg-text-wrap"></div>
  </div>

  <div class="app-container">
    <header id="app-header" class="app-header">
      <h1 id="brand-title" class="brand-title">サムネイル案件クイズ</h1>
      <p id="brand-subtitle" class="brand-subtitle">サムネとタイトルだけで企業案件を見抜こう！</p>
    </header>

    <!-- 1ページ目: ジャンル選択画面 -->
    <main id="screen-category" class="screen category-screen active">
      <div class="category-section">
        <p class="section-label">ジャンルを選択</p>
        <div id="category-chips" class="category-chips-group">
          <!-- Populated by JavaScript -->
        </div>
      </div>
      <p id="loading-notice" class="loading-notice" style="display: none;">問題を読み込み中...</p>
    </main>

    <!-- 2ページ目: 問題画面 -->
    <main id="screen-quiz" class="screen quiz-screen">
      <div class="quiz-top-bar">
        <span id="quiz-cat-name" class="quiz-category-badge">総合</span>
        <span id="quiz-progress-text" class="quiz-progress-label">第 1 / 10 問</span>
      </div>

      <div class="progress-track">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>

      <!-- YouTube埋め込みプレーヤー（画像なし・いきなり埋め込み） -->
      <div class="media-stage">
        <iframe
          id="quiz-iframe"
          src=""
          title="YouTube video player"
          allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>

      <!-- メタ情報（タイトル・投稿者） -->
      <div class="video-meta">
        <h2 id="quiz-video-title" class="video-title"></h2>
        <p id="quiz-channel-title" class="channel-title"></p>
      </div>

      <!-- 回答アクション（回答したらボタンが消えて答えが表示され、高さが変わらない） -->
      <div class="quiz-actions-container">
        <div id="choice-buttons-row" class="choice-buttons-row">
          <button id="btn-answer-sponsored" class="btn-choice btn-choice-sponsored" type="button">
            案件
          </button>
          <button id="btn-answer-normal" class="btn-choice btn-choice-normal" type="button">
            案件じゃない
          </button>
        </div>

        <!-- 回答直後のフィードバック（ボタンの代わりに同じ場所に表示） -->
        <div id="feedback-box" class="feedback-box">
          <div id="feedback-banner" class="feedback-banner">
            <span id="feedback-icon" class="feedback-icon">⭕️</span>
            <div class="feedback-texts">
              <div id="feedback-title" class="feedback-title">正解！</div>
              <div id="feedback-detail" class="feedback-subtext">この動画は企業案件です</div>
            </div>
          </div>
          <button id="btn-next" class="btn-next-question" type="button">次の問題へ</button>
        </div>
      </div>
    </main>

    <!-- 3ページ目: 結果画面 -->
    <main id="screen-result" class="screen result-screen">
      <div class="score-display">
        <span class="score-label">正解数</span>
        <div id="result-score" class="score-number">0 / 10</div>
      </div>

      <div class="result-actions">
        <a id="btn-share-x" class="btn-share-x" href="#" target="_blank" rel="noopener noreferrer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          結果をXでポストする
        </a>

        <button id="btn-replay" class="btn-replay-main" type="button">もう一度遊ぶ</button>
      </div>

      <!-- 振り返りセクション（画像は使わず、YouTube埋め込みで表示） -->
      <div class="review-section">
        <p class="section-label">出題された動画の振り返り（全10問）</p>
        <div id="review-list" class="review-list">
          <!-- Populated by JavaScript -->
        </div>
      </div>
    </main>

    <footer id="app-footer" class="app-footer">
      <p class="footer-notice">本サイトはYouTube Data API を使用し、YouTubeの利用規約を守って運営しています。</p>
    </footer>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
